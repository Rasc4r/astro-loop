name: Build Astro Loop AutoPilot APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Retrieve project source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Integrate AutoPilot
        run: python3 autopilot/apply_autopilot.py .

      - name: Compile debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Provide downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroLoop-AutoPilot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
